name: Workbench checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q shopee_workbench
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check shopee_workbench/static/app.js
      - run: node --test tests/ui.test.mjs
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.0
      - run: pip-audit -r requirements.lock
