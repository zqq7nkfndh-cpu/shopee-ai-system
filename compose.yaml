services:
  workbench:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set your public HTTPS origin}
      APP_PASSWORD: ${APP_PASSWORD:?Set a password of at least 12 characters}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      DATABASE_PATH: /data/workbench.sqlite3
    volumes:
      - workbench-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  workbench-data:
